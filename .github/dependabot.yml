version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework.kafka*"
      flyway:
        patterns:
          - "org.flywaydb*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      springdoc:
        patterns:
          - "org.springdoc*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot*"
          - "org.springframework.kafka*"
          - "org.flywaydb*"
          - "org.testcontainers*"
          - "org.springdoc*"
          - "org.apache.maven.plugins*"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    assignees:
      - hendisantika
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images in compose.yaml / docker-compose-redpanda.yml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore(docker)"
      include: scope
    groups:
      docker-images:
        patterns:
          - "*"
